name: Testes de integração
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r digitalizador/requirements.txt
      - run: python -m unittest discover -s captador/tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: organizador
      - run: python -m unittest discover -s digitalizador/tests -v
      - run: python -m unittest discover -s compilador/tests -v
      - run: python -m unittest discover -s emissor/tests -v
      - run: python -m basequestoes --base . validar
        working-directory: organizador
      - run: python -m basequestoes --base exemplos/base validar
        working-directory: organizador
